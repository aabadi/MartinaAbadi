<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuál es tu próximo paso profesional? | PeopleConnected</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ed;--paper:#fffdfa;--ink:#282522;--muted:#6d6259;--accent:#856855;--outline:#e4d9cc;--soft:#eee6dc}*{box-sizing:border-box}html{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:'League Spartan',Arial,sans-serif;font-size:18px;min-height:100vh;display:flex;flex-direction:column}body:before{content:"";height:7px;background:linear-gradient(90deg,#876b57,#d5b9a6,#876b57)}.wrap{width:min(100% - 38px,950px);margin:0 auto;flex:1;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:29px 2px;gap:20px}.brand{font-weight:800;letter-spacing:.065em;font-size:22px}.subtitle{font-size:13px;letter-spacing:.05em;color:var(--muted);margin-top:5px}.header .tag{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}main{flex:1;display:grid;place-items:center;padding:18px 0 35px}.panel{background:var(--paper);border:1px solid var(--outline);border-radius:22px;width:100%;padding:clamp(24px,5vw,58px);box-shadow:0 20px 60px #57473512}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(40px,6vw,68px);font-weight:700;line-height:1.04;letter-spacing:-.035em;margin:19px 0 20px;max-width:780px}h2{font-size:clamp(29px,4vw,42px);line-height:1.16;margin:17px 0 20px;letter-spacing:-.025em}.serif{font-family:'Lora',Georgia,serif;font-style:italic;font-weight:400}.lead{font-family:'Lora',Georgia,serif;line-height:1.75;font-size:clamp(15px,1.9vw,18px);color:#594e46;max-width:700px}.btn{font-family:inherit;font-weight:700;font-size:17px;letter-spacing:.015em;background:var(--accent);color:white;border:2px solid var(--accent);padding:16px 26px;min-height:54px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:12px;transition:background .15s}.btn:hover{background:#69503f;border-color:#69503f}.btn:focus-visible,.choice:focus-visible{outline:3px solid #b7a086;outline-offset:3px}.btn-secondary{background:transparent;color:var(--accent)}.btn-secondary:hover{background:var(--soft);border-color:var(--accent)}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.meta{margin-top:24px;color:var(--muted);font-size:14px}.progress-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--accent)}.progress{width:100%;height:7px;background:#eae2da;border-radius:100px;overflow:hidden;margin:14px 0 28px}.progress>div{height:100%;background:var(--accent);transition:width .2s}.choices{display:grid;gap:11px;margin-top:25px}.choice{width:100%;text-align:left;padding:17px 19px;background:white;border:1.5px solid #dacfc4;border-radius:11px;display:flex;align-items:center;gap:16px;color:var(--ink);font:500 18px/1.35 'League Spartan',Arial,sans-serif;cursor:pointer}.choice:hover{border-color:var(--accent);background:#fcf8f3}.choice[aria-pressed="true"]{border-color:var(--accent);background:#f3ede5;box-shadow:0 0 0 1px var(--accent)}.dot{height:22px;width:22px;flex-shrink:0;border:1.5px solid #a58a78;border-radius:50%;display:grid;place-items:center}.choice[aria-pressed="true"] .dot:after{content:"";background:var(--accent);width:12px;height:12px;border-radius:50%}.btn:disabled{opacity:.4;cursor:not-allowed}.result{max-width:740px}.result p{font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.85;color:#554a41}.result h2{font-size:clamp(36px,5vw,55px)}.result .note{font:14px/1.6 'League Spartan',Arial,sans-serif;color:#776c63;border-top:1px solid var(--outline);padding-top:20px;margin-top:28px}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:15px 2px 25px;color:#7b7169;font-size:13px}#app[hidden]{display:none}@media(max-width:540px){.header{padding:22px 0}.brand{font-size:18px}.subtitle{font-size:12px}.header .tag{display:none}.panel{border-radius:15px}.buttons{flex-direction:column}.btn{width:100%}.choice{font-size:17px}.footer{font-size:12px}h1{font-size:44px}}
</style>
</head>
<body>
<div class="wrap"><header class="header"><div><div class="brand">PEOPLECONNECTED</div><div class="subtitle">Consultora en Recursos Humanos</div></div><span class="tag">Seguí desafiándote.</span></header><main><div class="panel" id="app" aria-live="polite"></div></main><footer class="footer"><span>PeopleConnected · Experiencia interactiva de orientación profesional</span><span>Prototipo académico · No constituye una evaluación profesional</span></footer></div>
<script>
const questions=[
{q:'¿Qué sentís que le falta a tu etapa profesional actual?',a:['Nuevas oportunidades de liderazgo y crecimiento.','Mayor reconocimiento de mi experiencia y mis capacidades.','Un cambio de rol, empresa o sector.']},
{q:'¿Qué es lo que más valorás de tu trayectoria laboral?',a:['Los equipos y proyectos que lideré.','Los conocimientos y habilidades que desarrollé.','Mi capacidad para adaptarme a diferentes situaciones.']},
{q:'¿Qué te genera mayor incertidumbre al pensar en un cambio profesional?',a:['No saber cómo destacar mi experiencia frente a otros candidatos.','No tener claro qué oportunidades se ajustan a mi perfil.','No saber cómo planificar una transición hacia un nuevo puesto o sector.']},
{q:'¿Qué te gustaría lograr en los próximos años?',a:['Acceder a posiciones de mayor responsabilidad.','Enfrentar nuevos desafíos que me permitan seguir creciendo.','Explorar oportunidades profesionales diferentes a mi puesto actual.']},
{q:'¿Qué tipo de orientación considerás que necesitás?',a:['Aprender a comunicar mejor mis logros y fortalezas.','Identificar oportunidades laborales acordes con mi experiencia.','Definir un plan para dar el próximo paso en mi carrera.','Todavía no tengo claro qué necesito y me gustaría recibir orientación.']}
];
let step=-1, answers=Array(questions.length).fill(null);const app=document.getElementById('app');
function render(){
 if(step===-1){app.innerHTML=`<section><span class="eyebrow">PeopleConnected · Desarrollo profesional</span><h1>¿Cuál es tu próximo <span class="serif">paso profesional?</span></h1><p class="lead">Tu trayectoria profesional te trajo hasta acá. Tomate unos minutos para reflexionar sobre tu experiencia, tus objetivos y los nuevos desafíos que te gustaría afrontar.</p><div class="buttons"><button type="button" class="btn" id="start">COMENZAR <span aria-hidden="true">→</span></button></div><p class="meta">5 preguntas · Aproximadamente 2 minutos · Sin registro</p></section>`;document.getElementById('start').onclick=()=>go(0);return}
 if(step===questions.length){app.innerHTML=`<section class="result"><span class="eyebrow">Tu resultado</span><h2>Planificá tu <span class="serif">próximo paso</span></h2><p>Tus respuestas muestran que tenés ganas de seguir creciendo profesionalmente y de encontrar nuevos desafíos que te motiven. A lo largo de tu carrera adquiriste experiencia, conocimientos y habilidades que todavía tienen mucho potencial.</p><p>Ahora, el desafío está en descubrir nuevas oportunidades que te permitan aprovechar esa experiencia y seguir desarrollándote profesionalmente.</p><p>En PeopleConnected te acompañamos a reconocer tus fortalezas, explorar nuevas posibilidades y planificar tu próximo paso.</p><div class="buttons"><a class="btn" href="https://www.peopleconnectedrh.com/" target="_blank" rel="noopener noreferrer">CONOCÉ NUESTRAS ASESORÍAS <span aria-hidden="true">↗</span></a><button type="button" class="btn btn-secondary" id="restart">Volver a comenzar</button></div><p class="serif" style="color:var(--accent);font-size:20px;margin-top:32px">Seguí desafiándote.</p><p class="note">Esta es una devolución orientativa común para quienes completan el cuestionario. Las respuestas no se envían ni almacenan; el prototipo funciona en tu navegador.</p></section>`;document.getElementById('restart').onclick=()=>{answers.fill(null);go(-1)};return}
 const item=questions[step];app.innerHTML=`<section><div class="progress-row"><span>Pregunta ${step+1} de ${questions.length}</span><span>${Math.round(step/questions.length*100)}% completado</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${step}"><div style="width:${step/questions.length*100}%"></div></div><span class="eyebrow">Tu trayectoria, tus próximos desafíos</span><h2>${item.q}</h2><div class="choices" role="group" aria-label="Elegí una respuesta">${item.a.map((v,i)=>`<button type="button" class="choice" data-answer="${i}" aria-pressed="${answers[step]===i}"><span class="dot"></span><span>${v}</span></button>`).join('')}</div><div class="buttons"><button type="button" class="btn btn-secondary" id="back">← ANTERIOR</button><button type="button" class="btn" id="next" ${answers[step]===null?'disabled':''}>${step===questions.length-1?'VER MI RESULTADO':'SIGUIENTE →'}</button></div></section>`;
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.answer);render()});document.getElementById('back').onclick=()=>go(step-1);document.getElementById('next').onclick=()=>{if(answers[step]!==null)go(step+1)};
}
function go(s){step=s;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
